name: CI

# Workflow triggers: Runs on pushes targeting main, feature/fix/ci branches,
# and on all pull requests targeting the main branch.
on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel any redundant in-progress runs on new pushes to the same reference
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository source code
        uses: actions/checkout@v4

      - name: Inspect and Verify GCC Compiler Environment
        id: probe
        run: |
          echo "=== GCC Toolchain Information ==="
          gcc --version
          echo "=== Host Environment ==="
          uname -a
          echo "=== Testing GCC C11 Compliance ==="
          echo 'int main(void) { return 0; }' | gcc -std=c11 -Wall -Wextra -x c - -o /tmp/c11_probe
          /tmp/c11_probe
          echo "GCC C11 probe completed successfully."

      - name: Build Simple Shell (Standard GCC C11)
        id: build
        timeout-minutes: 5
        run: |
          echo "Building simple-shell binary using standard compiler flags..."
          make clean
          make all

      - name: Execute Parser Unit Tests & Functional Shell Test Suite
        id: tests
        timeout-minutes: 5
        run: |
          echo "Running unit tests and end-to-end integration test scenarios..."
          make test

      - name: Execute AddressSanitizer & UndefinedBehaviorSanitizer Checks
        id: sanitizers
        timeout-minutes: 5
        env:
          ASAN_OPTIONS: 'detect_leaks=1:abort_on_error=1:symbolize=1:fast_unwind_on_malloc=0'
          UBSAN_OPTIONS: 'print_stacktrace=1:halt_on_error=1'
        run: |
          echo "Running full test suite under AddressSanitizer and UndefinedBehaviorSanitizer..."
          make asan-test

      - name: Install Valgrind
        id: valgrind_install
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Execute Valgrind Resource Audit
        id: valgrind
        timeout-minutes: 5
        run: |
          echo "Running parser and executor tests under Valgrind..."
          make clean
          make valgrind

      - name: Verify Working Tree Cleanliness
        id: cleanliness
        timeout-minutes: 2
        run: |
          echo "Cleaning build artifacts and verifying repository hygiene..."
          make clean
          git status --porcelain
          test -z "$(git status --porcelain)" || (echo "Error: Unclean working tree after make clean" && exit 1)

      - name: Publish CI Workflow Summary
        if: always()
        env:
          PROBE: ${{ steps.probe.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          SANITIZERS: ${{ steps.sanitizers.outcome }}
          VALGRIND_INSTALL: ${{ steps.valgrind_install.outcome }}
          VALGRIND: ${{ steps.valgrind.outcome }}
          CLEANLINESS: ${{ steps.cleanliness.outcome }}
        run: |
          status() {
            case "$1" in
              success) echo "Pass" ;;
              failure) echo "Fail" ;;
              cancelled) echo "Cancelled" ;;
              skipped) echo "Skipped" ;;
              *) echo "Unknown" ;;
            esac
          }

          echo "### CI Pipeline Execution Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Target | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|:---:|" >> "$GITHUB_STEP_SUMMARY"
          echo "| GCC C11 Toolchain Probe | probe | $(status "$PROBE") |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Standard Compilation | make all | $(status "$BUILD") |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parser & Integration Tests | make test | $(status "$TESTS") |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Address & UB Sanitizers | make asan-test | $(status "$SANITIZERS") |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Valgrind Installation | apt-get install valgrind | $(status "$VALGRIND_INSTALL") |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Valgrind Resource Audit | make valgrind | $(status "$VALGRIND") |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cleanliness & Hygiene | make clean | $(status "$CLEANLINESS") |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Runner: ubuntu-latest. Statuses reflect the actual GitHub Actions step outcomes." >> "$GITHUB_STEP_SUMMARY"
